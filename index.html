  scrollbar-width: thin;
  scrollbar-color: #e6dfd8 transparent;
}

[data-hve-chart-panel]::-webkit-scrollbar {
  width: 4px;
}

[data-hve-chart-panel]::-webkit-scrollbar-thumb {
  background: #e6dfd8;
  border-radius: 4px;
}

.hve-chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid #e6dfd8;
  background: #f5f0e8;
  position: sticky;
  top: 0;
  z-index: 1;
}

.hve-chart-title {
  font-size: 13px;
  font-weight: 600;
  color: #141413;
}

.hve-chart-close {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  color: #6c6a64;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hve-chart-close:hover {
  background: #f5f0e8;
  color: #141413;
}

.hve-chart-body {
  padding: 12px 14px;
}

.hve-chart-section {
  margin-bottom: 4px;
}

.hve-chart-section-title {
  font-size: 11px;
  font-weight: 600;
  color: #8e8b82;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.hve-chart-divider {
  height: 1px;
  background: #e6dfd8;
  margin: 10px 0;
}

.hve-chart-template-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.hve-chart-template-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border: 1px solid #e6dfd8;
  border-radius: 10px;
  background: #faf9f5;
  cursor: pointer;
  transition: all 0.15s;
}

.hve-chart-template-btn:hover {
  background: #efe9de;
  border-color: #cc785c;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(204,120,92,0.12);
}

.hve-chart-template-icon {
  font-size: 18px;
  line-height: 1;
}

.hve-chart-template-name {
  font-size: 10px;
  color: #3d3d3a;
  font-weight: 500;
}

.hve-chart-typo-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hve-chart-typo-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid #e6dfd8;
  border-radius: 8px;
  background: #faf9f5;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
}

.hve-chart-typo-btn:hover {
  background: #f5f0e8;
  border-color: #cc785c;
}

.hve-chart-typo-preview {
  font-size: 14px;
  color: #141413;
  min-width: 55px;
}

.hve-chart-typo-name {
  font-size: 11px;
  color: #6c6a64;
  font-weight: 500;
}

.hve-chart-fine-controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.hve-chart-ctrl-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.hve-chart-ctrl-row label {
  font-size: 11px;
  color: #6c6a64;
  min-width: 50px;
  font-weight: 500;
}

.hve-chart-ctrl-row input[type="range"] {
  flex: 1;
  accent-color: #cc785c;
  height: 4px;
}

.hve-chart-ctrl-row select {
  flex: 1;
  padding: 3px 6px;
  border: 1px solid #e6dfd8;
  border-radius: 6px;
  font-size: 11px;
  color: #141413;
  background: #faf9f5;
}

.hve-chart-ctrl-val {
  font-size: 10px;
  color: #8e8b82;
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

[data-hve-toolbar] button[data-action="chart-typo"].hve-tb-chart-active {
  background: #ECFDF5;
  color: #10B981;
  box-shadow: inset 0 0 0 1px rgba(16,185,129,0.2);
}
</style>
